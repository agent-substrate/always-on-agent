apiVersion: v1
kind: ServiceAccount
metadata:
  name: openclaw-dashboard
  namespace: openclaw
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: openclaw-dashboard
rules:
  - apiGroups: [""]
    resources: ["pods", "services"]
    verbs: ["get", "list"]
  # kubectl-ate auto-port-forwards to the ateapi to list actors.
  - apiGroups: [""]
    resources: ["pods/portforward"]
    verbs: ["create", "get"]
  # kubectl-ate reads the ate-api-server Deployment to detect auth mode + endpoint.
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]
  # actortemplates is deliberately absent: it is an ateapi resource in this
  # release, not a CRD in this group.
  - apiGroups: ["ate.dev"]
    resources: ["workerpools"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: openclaw-dashboard
subjects:
  - kind: ServiceAccount
    name: openclaw-dashboard
    namespace: openclaw
roleRef:
  kind: ClusterRole
  name: openclaw-dashboard
  apiGroup: rbac.authorization.k8s.io
---
# There is deliberately no pods/exec grant here. The dashboard used to hold one
# so it could read WhatsApp link state out of the gateway container and drive
# pairing. Both panels are gone, and with them the only verb this ServiceAccount
# had that could change anything. It is now read-only against the cluster.
#
# kubectl-ate does not present the pod's own ServiceAccount token to ateapi. It
# mints one by issuing a TokenRequest against ate-system/ate-client, so without
# this the dashboard authenticates as nobody and every actor call comes back
# "missing bearer token" while the pod itself looks perfectly healthy.
#
# Scoped as a namespaced Role naming that one ServiceAccount, rather than a
# cluster-wide power to mint tokens for any identity.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: openclaw-dashboard-mint-ate-token
  namespace: ate-system
rules:
  - apiGroups: [""]
    resources: ["serviceaccounts/token"]
    resourceNames: ["ate-client"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: openclaw-dashboard-mint-ate-token
  namespace: ate-system
subjects:
  - kind: ServiceAccount
    name: openclaw-dashboard
    namespace: openclaw
roleRef:
  kind: Role
  name: openclaw-dashboard-mint-ate-token
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openclaw-dashboard
  namespace: openclaw
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openclaw-dashboard
  template:
    metadata:
      labels:
        app: openclaw-dashboard
    spec:
      serviceAccountName: openclaw-dashboard
      containers:
        - name: dashboard
          image: gcr.io/REPLACE_WITH_YOUR_PROJECT/openclaw-dashboard@REPLACE_WITH_DASHBOARD_DIGEST
          ports:
            - containerPort: 8090
              name: http
          env:
            - name: NAMESPACE
              value: openclaw
            - name: ATE_ENDPOINT
              value: "api.ate-system.svc.cluster.local:443"
            - name: GATEWAY_URL
              value: "http://openclaw-gateway.openclaw.svc.cluster.local:18789"
            - name: KUBECTL_ATE
              value: "/usr/local/bin/kubectl-ate"
            # Atespace(s) the demo actors live in (current OSS actor model).
            - name: ATESPACES
              value: "openclaw-demo"
          resources:
            requests:
              memory: 64Mi
              cpu: 25m
            limits:
              memory: 128Mi
              cpu: 100m
---
apiVersion: v1
kind: Service
metadata:
  name: openclaw-dashboard
  namespace: openclaw
spec:
  type: LoadBalancer
  selector:
    app: openclaw-dashboard
  ports:
    - name: http
      port: 8090
      targetPort: http
