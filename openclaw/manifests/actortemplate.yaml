# ActorTemplate for the suspendable OpenClaw agent.
#
# NOTE (schema change): ActorTemplate is no longer a Kubernetes CRD. Upstream
# moved it to a substrate-native resource (ateapipb.ActorTemplate), so this file
# is a *protojson-shaped* document with no apiVersion/kind/namespace, and it is
# created through the ate API:
#
#     kubectl ate create atespace openclaw
#     kubectl ate create actor-template -f manifests/actortemplate.yaml
#
# `kubectl apply -f` no longer works: the actortemplates.ate.dev CRD is gone.
# Templates are also immutable now: there is no update, so deploy-demo.sh deletes
# and recreates to change one.
#
# The controller boots a golden actor from this, waits for the workload to warm
# up, then checkpoints it to the install's snapshot location. Actors cloned from
# the golden restore on demand.
metadata:
  # The atespace replaces the old metadata.namespace, and it must already exist.
  # It has to be the SAME atespace the actors live in: `kubectl ate create actor
  # --template` resolves the template in the actor's
  # atespace, so a template parked in the k8s namespace instead is simply not
  # found.
  atespace: openclaw-demo
  name: openclaw-agent
workerSelector:
  matchLabels:
    workload: openclaw
containers:
  - name: agent
    # The substrate-integrated OpenClaw image (base openclaw + extensions/substrate),
    # MUST be @sha256-pinned (changing the image invalidates snapshots).
    image: gcr.io/REPLACE_WITH_YOUR_PROJECT/openclaw-actor@REPLACE_WITH_ACTOR_DIGEST
    # Entrypoint of the public OpenClaw image (WORKDIR /app). The older private
    # base bundled the CLI at /app/dist/index.js instead.
    command: ["node", "/app/openclaw.mjs", "gateway", "--allow-unconfigured", "--bind", "lan", "--port", "80"]
    env:
      - { name: HOME, value: /home/node }
      - { name: OPENCLAW_CONFIG_DIR, value: /home/node/.openclaw }
      - { name: NODE_ENV, value: production }
      # Trust the egress gateway's MITM CA (projected below) for outbound HTTPS.
      - { name: NODE_EXTRA_CA_CERTS, value: /run/ate/egress-trust-bundle/trust-bundle.pem }
      # Substrate removed valueFrom/secretKeyRef from ActorTemplate env in #835
      # Actors are meant to get no direct access to Secrets, with credentials
      # injected on the egress route instead. That egress injection tier does
      # not exist yet, so both values below are literals substituted by
      # deploy-demo.sh at create time (same approach as Substrate's own
      # hack/install-demo-claude-code-multiplex.sh). Never commit the rendered
      # manifest: the key lands in the template and in the golden snapshot.
      - { name: GEMINI_API_KEY, value: "REPLACE_WITH_GEMINI_API_KEY" }
      # Shared bearer token: the gateway calls the actor's /v1/chat/completions
      # with this token (gateway.auth.mode=token), so it must match the gateway's.
      - { name: OPENCLAW_GATEWAY_TOKEN, value: "REPLACE_WITH_GATEWAY_TOKEN" }
    volumeMounts:
      - name: system-info
        mountPath: /run/ate
    # NOTE: no wakeup probe. OpenClaw's /healthz reports "live" early (before
    # plugin pre-warm), so the golden checkpoint is gated on the control plane's
    # wall-clock warmup instead, still a fixed 20s in v1 (goldenSnapshotWarmup);
    # declaring a wakeupProbe on every container would drop it to 0. 20s has
    # been sufficient in testing.
    # atenet routes to actor port 80.
volumes:
  # The actor's own identity, projected as files. This is NOT automatic: without
  # this volume /run/ate/actor-id simply does not exist. Nothing in the demo path
  # depends on it (the gateway drives suspend and already knows each actor's
  # name), but it is what an in-sandbox workload would read to learn who it is,
  # and it makes `kubectl ate logs` output easy to correlate. The projection is
  # fixed for the actor's lifetime across suspend/resume/migration.
  - name: system-info
    systemInfo:
      dataSources:
        - actorMetadata:
            items:
              - field: ACTOR_METADATA_FIELD_NAME
                path: actor-id
              - field: ACTOR_METADATA_FIELD_ATESPACE
                path: atespace
              - field: ACTOR_METADATA_FIELD_UID
                path: actor-uid
        # On Substrate v1 every HTTPS connection from the actor is intercepted
        # by the egress gateway, which presents a certificate from its own MITM
        # CA. Node doesn't trust that CA, so without this bundle (and
        # NODE_EXTRA_CA_CERTS above) every model call fails with "network
        # connection error". Only allowlisted bundle names resolve.
        - trustBundle:
            names:
              - egress-mitm.ate.dev
              - system-roots.ate.dev
            path: egress-trust-bundle/trust-bundle.pem
# Each actor's compute size, required by Substrate v1. Placement admits an actor
# against these limits, so they decide how many fit on a worker.
resources:
  limits:
    cpuMillicores: 1000
    memoryBytes: 2147483648 # 2 GiB
snapshotConfig:
  # MEMORY = process memory + root filesystem changes + durable data, so a resume
  # picks up a warm, already-thinking agent. Snapshots go to the install's
  # cluster-wide snapshot location. The sandbox (gVisor) is chosen by the
  # WorkerPool this template selects, not by the template.
  preferredFidelity: SNAPSHOT_FIDELITY_MEMORY
