# TEN STAND-IN AGENTS - a hedge, not P4.
#
# P4 is Nous's deliverable: the ten agent configurations the acceptance pass is
# supposed to run against. §7.1 is deliberate about why - "a pass against agents
# we invented proves the platform, not the product." Nothing in this file
# changes that. It exists so the soak can start on time if P4 has not landed,
# and every use of it has to be reported as what it is.
#
# If these are used, the report says the ten agents were Substrate's, not Nous's,
# and T4 and T2 are qualified accordingly. Do not quietly substitute.
#
# ---------------------------------------------------------------------------
# What this cluster cannot do, stated up front rather than discovered mid-soak
#
# `hermes-secrets` on substrate-hermes-accept holds API_SERVER_KEY and
# MODEL_API_KEY and nothing else - there is no TELEGRAM_BOT_TOKEN, and no
# agents ConfigMap has ever been applied here. So no `deliver_to` on this
# cluster can succeed, whatever it points at.
#
# That is survivable for T3 and fatal for T4, and the two should not be
# confused:
#
#   T3 asks for "zero missed jobs; fire log against schedule". The firing is
#   observable in the gateway log without any channel, so T3 can be closed here
#   as a *fire* result, with delivery explicitly out of scope.
#
#   T4 asks for a user-visible acknowledgement on the work surface, every time.
#   That cannot be evidenced on this cluster at all. T4 stays blocked on §3.2,
#   and this file does not unblock it. It is listed here so nobody reads ten
#   configured agents as ten deliverable channels.
#
# `deliver_to` is required by gateway/agents.py - a job without one is a config
# error - and the registry also refuses to bind one channel to two agents, so
# they cannot all share a single sink. Each agent therefore gets `telegram:-N`.
# Negative ids are Telegram's group form and single digits are not real groups,
# so these are unmistakable non-addresses rather than REPLACE_WITH placeholders
# somebody might apply believing they work. Delivery will fail loudly and
# identically for every job, which is the honest behaviour when there is no
# channel. Before any run where delivery matters, set real chat ids and a
# TELEGRAM_BOT_TOKEN.
#
# ---------------------------------------------------------------------------
# How the ten are shaped, and why
#
# Idle tiers (gateway/agents.py IDLE_TIERS): short=60s, medium=900s,
# long=3600s, always-on=never suspends.
#
#   Six on `short`      - the soak needs cycles, and a 60s idle window is what
#                         produces them. These carry T1.
#   Three on `medium`   - 900s. Held closer to genuinely idle for T2's split:
#                         the plan wants seven cycling overnight and three not.
#   One on `long`       - 3600s. One agent that sleeps deeply, so T6's clock
#                         reconciliation has a case with a long gap rather than
#                         only sixty-second ones.
#
# No agent is `always-on`: an actor that never suspends contributes nothing to a
# suspend/resume soak and holds a worker the other nine need.
#
# T2 split, per §5: the three `medium` agents (standin-07/08/09) are the three
# held idle. The other seven cycle. All ten get the morning question.
#
# Each agent is seeded with one durable fact in its `jobs` prompt wording so
# that T2's morning question has something to depend on that is specific to
# that agent and cannot be answered from the prompt alone.
#
# Cron specs are staggered across the hour rather than aligned, so T3 measures
# ten independent schedules and not one thundering herd - which is T9's job,
# and conflating the two would make both unreadable.
#
#   kubectl --context REPLACE_WITH_KUBECTL_CONTEXT \
#     apply -f k8s/hermes-agents-standin.yaml
#   kubectl --context ... -n hermes rollout restart deploy/hermes-gateway
#
# Note the rollout restart: the gateway reads this at start. Restarting it is
# also what T10 does, so do not do this once the soak is counting.
apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-agents
  namespace: hermes
  labels:
    hermes.substrate.dev/provenance: substrate-standin
    hermes.substrate.dev/not: production
