apiVersion: v1
kind: ServiceAccount
metadata:
  name: openclaw-dashboard
  namespace: openclaw
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: openclaw-dashboard
rules:
  - apiGroups: [""]
    resources: ["pods", "services"]
    verbs: ["get", "list"]
  # kubectl-ate auto-port-forwards to the ateapi to list actors.
  - apiGroups: [""]
    resources: ["pods/portforward"]
    verbs: ["create", "get"]
  # kubectl-ate reads the ate-api-server Deployment to detect auth mode + endpoint.
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]
  - apiGroups: ["ate.dev"]
    resources: ["workerpools", "actortemplates"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: openclaw-dashboard
subjects:
  - kind: ServiceAccount
    name: openclaw-dashboard
    namespace: openclaw
roleRef:
  kind: ClusterRole
  name: openclaw-dashboard
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openclaw-dashboard
  namespace: openclaw
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openclaw-dashboard
  template:
    metadata:
      labels:
        app: openclaw-dashboard
    spec:
      serviceAccountName: openclaw-dashboard
      containers:
        - name: dashboard
          image: gcr.io/REPLACE_WITH_YOUR_PROJECT/openclaw-dashboard@REPLACE_WITH_DASHBOARD_DIGEST
          ports:
            - containerPort: 8090
              name: http
          env:
            - name: NAMESPACE
              value: openclaw
            - name: ATE_ENDPOINT
              value: "api.ate-system.svc.cluster.local:443"
            - name: GATEWAY_URL
              value: "http://openclaw-gateway.openclaw.svc.cluster.local:18789"
            - name: KUBECTL_ATE
              value: "/opt/bin/kubectl-ate"
            # Atespace(s) the demo actors live in (current OSS actor model).
            - name: ATESPACES
              value: "openclaw-demo"
          resources:
            requests:
              memory: 64Mi
              cpu: 25m
            limits:
              memory: 128Mi
              cpu: 100m
          volumeMounts:
            - name: kubectl-ate
              mountPath: /opt/bin
      volumes:
        - name: kubectl-ate
          emptyDir: {}
      initContainers:
        # Copy kubectl-ate out of the gateway image rather than building it
        # here. The gateway already carries one built from the pinned Substrate
        # commit, and a second build from a floating clone would drift away from
        # the control plane and fail with opaque gRPC errors, not version ones.
        - name: fetch-kubectl-ate
          image: gcr.io/REPLACE_WITH_YOUR_PROJECT/openclaw-gateway@REPLACE_WITH_GATEWAY_DIGEST
          command: ["cp", "/usr/local/bin/kubectl-ate", "/opt/bin/kubectl-ate"]
          volumeMounts:
            - name: kubectl-ate
              mountPath: /opt/bin
---
apiVersion: v1
kind: Service
metadata:
  name: openclaw-dashboard
  namespace: openclaw
spec:
  type: LoadBalancer
  selector:
    app: openclaw-dashboard
  ports:
    - name: http
      port: 8090
      targetPort: http
