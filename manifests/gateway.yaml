apiVersion: v1
kind: Namespace
metadata:
  name: openclaw
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openclaw-gateway
  namespace: openclaw
---
# RBAC for kubectl-ate (per-conversation actor provisioning): it port-forwards to
# the ateapi pod and reads the ate-api-server Deployment to detect auth mode.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: openclaw-gateway
rules:
  - apiGroups: [""]
    resources: ["pods", "services"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/portforward"]
    verbs: ["create", "get"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: openclaw-gateway
subjects:
  - kind: ServiceAccount
    name: openclaw-gateway
    namespace: openclaw
roleRef:
  kind: ClusterRole
  name: openclaw-gateway
  apiGroup: rbac.authorization.k8s.io
---
# ateapi accepts either a podcert mTLS identity or a JWT bearer token. kubectl-ate
# dials without a client cert, so it mints one: a TokenRequest for the `ate-client`
# ServiceAccount in ate-system, audienced to the API server. Without this the
# gateway's every call fails `Unauthenticated: missing bearer token`. Scoped to
# that one ServiceAccount by resourceNames.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: openclaw-gateway-ate-client-token
  namespace: ate-system
rules:
  - apiGroups: [""]
    resources: ["serviceaccounts/token"]
    resourceNames: ["ate-client"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: openclaw-gateway-ate-client-token
  namespace: ate-system
subjects:
  - kind: ServiceAccount
    name: openclaw-gateway
    namespace: openclaw
roleRef:
  kind: Role
  name: openclaw-gateway-ate-client-token
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: Service
metadata:
  name: openclaw-gateway
  namespace: openclaw
spec:
  # LoadBalancer to match the live Control UI service (external IP preserved).
  type: LoadBalancer
  selector:
    app: openclaw-gateway
  ports:
    - name: gateway
      port: 18789
      targetPort: gateway
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openclaw-gateway
  namespace: openclaw
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: openclaw-gateway
  template:
    metadata:
      labels:
        app: openclaw-gateway
    spec:
      serviceAccountName: openclaw-gateway
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Copy the gateway config onto the PVC, then install the substrate plugin
        # into the PVC state dir (its registry lives under .openclaw, so it must be
        # installed at runtime, not baked into the image). Config is copied first so
        # `plugins install`'s config validation (which requires role) passes.
        #
        # HOME points *into* the PVC rather than at it, so ~/.openclaw is a
        # subdirectory of the mount instead of the mount root. OpenClaw writes its
        # state atomically and chmods the containing directory, and a PVC's mount
        # root is owned by root -- fsGroup sets the group and the setgid bit, never
        # the owner -- so anything writing directly into the mount root fails with
        # `EPERM: fchmod`. Setting OPENCLAW_CONFIG_DIR alone is not enough: the
        # plugin registry path is derived from HOME regardless. The mkdir below
        # runs as uid 1000, so the directory is owned by the user that chmods it.
        - name: config-and-plugin-init
          image: gcr.io/REPLACE_WITH_YOUR_PROJECT/openclaw-gateway@REPLACE_WITH_GATEWAY_DIGEST
          command: ["sh", "-c"]
          args:
            - |
              mkdir -p /home/node/state/.openclaw
              cp /config/openclaw.json /home/node/state/.openclaw/openclaw.json
              node /app/openclaw.mjs plugins install /app/extensions/substrate --force --accept-capabilities
              # WhatsApp is no longer bundled in the OpenClaw image; it is an
              # external ClawHub plugin, and its version has to track the base
              # image (the floating `@openclaw/whatsapp` refuses to install
              # against an older runtime: "requires plugin API >=X"). Bump this
              # with the base digest in build/gateway.Dockerfile. It runs here
              # rather than in the gateway container because installing its
              # dependencies needs more memory than the gateway's limit allows,
              # and it is skipped if already present on the PVC.
              node /app/openclaw.mjs plugins install clawhub:@openclaw/whatsapp@2026.8.2 --accept-capabilities || true
          env:
            - name: HOME
              value: /home/node/state
            - name: OPENCLAW_CONFIG_DIR
              value: /home/node/state/.openclaw
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: openclaw-home
              mountPath: /home/node/state
            - name: config
              mountPath: /config
              readOnly: true
            - name: tmp-volume
              mountPath: /tmp
            - name: cache-volume
              mountPath: /home/node/state/.cache
      containers:
        - name: gateway
          # OpenClaw slim + compiled substrate plugin + kubectl-ate (built by build/gateway.Dockerfile).
          image: gcr.io/REPLACE_WITH_YOUR_PROJECT/openclaw-gateway@REPLACE_WITH_GATEWAY_DIGEST
          command:
            - node
            - /app/openclaw.mjs
            - gateway
            - --bind
            - lan
            - --port
            - "18789"
          ports:
            - name: gateway
              containerPort: 18789
              protocol: TCP
          env:
            - name: HOME
              value: /home/node/state
            - name: OPENCLAW_CONFIG_DIR
              value: /home/node/state/.openclaw
            - name: NODE_ENV
              value: production
            # Lets the plugin's kubectl-ate reach ateapi directly (no deployment lookup).
            - name: ATE_ENDPOINT
              value: "api.ate-system.svc.cluster.local:443"
            - name: OPENCLAW_GATEWAY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: openclaw-secrets
                  key: gateway-token
          envFrom:
            - secretRef:
                name: openclaw-api-keys
                optional: true
          resources:
            requests:
              memory: 512Mi
              cpu: 100m
            limits:
              # Headroom for the gateway node process, the WhatsApp channel plugin
              # and the kubectl-ate child it spawns for actor create/suspend. 640Mi
              # was enough before WhatsApp moved out of the base image into a
              # plugin; with it loaded the node heap hits its limit during startup
              # and the container dies with "Reached heap limit". The gateway takes
              # ~30-40s to open its HTTP listener under gVisor-neighbor CPU
              # pressure, so probes use curl (cheap) rather than spawning a full
              # node process each cycle.
              memory: 1536Mi
              cpu: 600m
          livenessProbe:
            exec:
              command: ["sh", "-c", "curl -sf -m 8 http://127.0.0.1:18789/healthz"]
            initialDelaySeconds: 120
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 6
          readinessProbe:
            exec:
              command: ["sh", "-c", "curl -sf -m 8 http://127.0.0.1:18789/readyz"]
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 8
            failureThreshold: 18
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: openclaw-home
              mountPath: /home/node/state
            - name: tmp-volume
              mountPath: /tmp
            - name: cache-volume
              mountPath: /home/node/state/.cache
      volumes:
        - name: openclaw-home
          persistentVolumeClaim:
            claimName: openclaw-gateway-pvc
        - name: tmp-volume
          emptyDir: {}
        # The root filesystem is read-only, but OpenClaw needs a writable cache
        # dir under HOME (it falls back to ~/.cache/openclaw-<uid>) and aborts at
        # startup if it cannot create one. Nested inside the PVC mount because HOME
        # is, but kept an emptyDir: it is pure scratch and should not eat the claim.
        - name: cache-volume
          emptyDir: {}
        - name: config
          configMap:
            name: openclaw-gateway-config
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: openclaw-gateway-pvc
  namespace: openclaw
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
