apiVersion: v1
kind: Secret
metadata:
  name: openclaw-secrets
  namespace: openclaw
type: Opaque
stringData:
  gateway-token: "REPLACE_WITH_RANDOM_TOKEN"
---
apiVersion: v1
kind: Secret
metadata:
  name: openclaw-api-keys
  namespace: openclaw
type: Opaque
stringData:
  GEMINI_API_KEY: "REPLACE_WITH_YOUR_API_KEY"
