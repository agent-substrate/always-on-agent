# Build the stripped Hermes actor image on Cloud Build (no local Docker needed).
#
#   source demo/env.sh
#   gcloud builds submit --config=actor/cloudbuild.yaml \
#     --substitutions=_ACTOR_IMAGE="$ACTOR_IMAGE" actor/
#
# demo/validate.sh does this for you. The positional arg (actor/) is the build context
# uploaded to Cloud Build, so the Dockerfile COPY of entrypoint.sh resolves.
#
# The ActorTemplate needs a digest, not a tag; validate.sh reads it back with:
#   gcloud container images describe "$ACTOR_IMAGE" \
#     --format='value(image_summary.fully_qualified_digest)'
#
# _HERMES_REF pins which Hermes commit is installed. It is a SHA, not `main`, so this build is
# reproducible; override it to track upstream or to test a newer Hermes, but expect to re-run
# demo/validate.sh afterwards - a new Hermes is a new image, and snapshots do not carry over.
substitutions:
  _ACTOR_IMAGE: ""      # required - no sensible default; must be YOUR registry
  _HERMES_REF: 5ffbea81e995aaa3b6b6b5ba81d1f453a6b88ef8
timeout: 2400s
options:
  machineType: E2_HIGHCPU_8
  substitutionOption: ALLOW_LOOSE
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --tag=${_ACTOR_IMAGE}
      - --build-arg=HERMES_REF=${_HERMES_REF}
      - --file=Dockerfile
      - .
images:
  - ${_ACTOR_IMAGE}
