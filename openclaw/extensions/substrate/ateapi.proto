syntax = "proto3";

// Subset of github.com/agent-substrate/substrate/api/ateapi/v1/ateapi.proto
// (Substrate v1) needed by this plugin. The package and service name MUST be
// `substrate.ateapi.v1.Control` to match the real server (the gRPC method path
// is /substrate.ateapi.v1.Control/<Method>), and every field number MUST match
// the server's ateapi.proto; protobuf is field-number based, so a subset of
// fields is fine but the numbers must line up.
package substrate.ateapi.v1;

service Control {
  rpc GetActor(GetActorRequest) returns (Actor) {}
  rpc CreateActor(CreateActorRequest) returns (Actor) {}
  rpc SuspendActor(SuspendActorRequest) returns (SuspendActorResponse) {}
  rpc DeleteActor(DeleteActorRequest) returns (Actor) {}
}

message ObjectRef {
  string atespace = 1;
  string name = 2;
}

// Subset of ResourceMetadata (only the caller-specified identity fields).
message ResourceMetadata {
  string atespace = 1;
  string name = 2;
}

// Subset of Actor: identity + which ActorTemplate (golden) to derive from.
message Actor {
  ResourceMetadata metadata = 1;
  ObjectRef actor_template = 2;
}

message GetActorRequest { ObjectRef actor = 1; }
message CreateActorRequest { Actor actor = 1; }
message SuspendActorRequest { ObjectRef actor = 1; }
message SuspendActorResponse { Actor actor = 1; }
message DeleteActorRequest { ObjectRef actor = 1; }
