# Template ONLY - do not commit real keys. Copy to hermes-secret.yaml, fill in, apply.
# (Or create imperatively without a file:
#   kubectl create secret generic hermes-secrets -n hermes \
#     --from-literal=MODEL_API_KEY=... --from-literal=API_SERVER_KEY=$(openssl rand -hex 24) )
#
#   MODEL_API_KEY  : your LLM provider key. Vendor-neutral on purpose: the actor
#                    entrypoint exports it under whichever name the configured
#                    provider expects (GOOGLE_API_KEY for gemini, ANTHROPIC_API_KEY
#                    for anthropic, OPENAI_API_KEY otherwise), so the image is not
#                    tied to one vendor. Default provider is gemini.
#   API_SERVER_KEY : shared bearer token for the Hermes API server (>=16 chars). Its
#                    presence is what ENABLES the API server; clients send it as
#                    `Authorization: Bearer <API_SERVER_KEY>`.
#
# WhatsApp Cloud API (optional - only needed to enable the WhatsApp channel on the
# gateway). All from your Meta developer app (developers.facebook.com):
#   WHATSAPP_CLOUD_ACCESS_TOKEN : WhatsApp > API Setup (temp 24h token) or a permanent
#                                 System User token. 🔒 secret.
#   WHATSAPP_CLOUD_APP_SECRET   : App settings > Basic > App Secret. Used to verify the
#                                 X-Hub-Signature-256 on inbound webhooks. 🔒 secret.
#   WHATSAPP_CLOUD_VERIFY_TOKEN : a string you choose; also pasted into Meta's webhook
#                                 config so the GET verify handshake matches.
# The non-secret WHATSAPP_CLOUD_PHONE_NUMBER_ID / _API_VERSION go in the Deployment env,
# not here.
apiVersion: v1
kind: Secret
metadata:
  name: hermes-secrets
  namespace: hermes
type: Opaque
stringData:
  MODEL_API_KEY: "REPLACE_WITH_PROVIDER_KEY"
  # Service account key the egress plugin mints short lived model tokens from.
  # Only the plugin mounts this. It never reaches an actor.
  MODEL_SA_KEY: "REPLACE_WITH_SERVICE_ACCOUNT_JSON"
  API_SERVER_KEY: "REPLACE_WITH_RANDOM_TOKEN_MIN_16_CHARS"
  # Distinct gateway-only key for trusted adapters; blank disables generic ingress.
  GATEWAY_INGRESS_KEY: ""
  # Leave blank to keep the WhatsApp channel disabled.
  WHATSAPP_CLOUD_ACCESS_TOKEN: ""
  WHATSAPP_CLOUD_APP_SECRET: ""
  WHATSAPP_CLOUD_VERIFY_TOKEN: ""
