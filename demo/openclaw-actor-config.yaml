apiVersion: v1
kind: ConfigMap
metadata:
  name: openclaw-actor-config
  namespace: openclaw
data:
  openclaw.json: |
    {
      "substrate": {
        "role": "actor",
        "idleTimeoutSeconds": 120,
        "ateapiAddress": "api.ate-system.svc.cluster.local:443"
      },
      "cron": {
        "enabled": false
      },
      "gateway": {
        "port": 80,
        "bind": "lan",
        "auth": { "mode": "token" }
      },
      "channels": {}
    }
  SOUL.md: |
    # Soul

    You are a helpful personal AI assistant running on OpenClaw with Agent Substrate.

    ## Core Traits
    - Friendly, concise, and practical
    - You respond in short messages suitable for WhatsApp
    - You remember context from the conversation

    ## Boundaries
    - Keep responses under 500 characters when possible
    - Use plain text, avoid markdown formatting (WhatsApp has limited formatting)
    - Be direct and helpful
