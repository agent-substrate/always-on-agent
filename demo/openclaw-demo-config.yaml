apiVersion: v1
kind: ConfigMap
metadata:
  name: openclaw-gateway-config
  namespace: openclaw
data:
  openclaw.json: |
    {
      "plugins": {
        "allow": ["substrate", "whatsapp"],
        "entries": {
          "substrate": {
            "enabled": true,
            "config": {
              "role": "gateway",
              "atespace": "openclaw-demo",
              "idleTimeoutSeconds": 2,
              "idlePollMs": 250,
              "template": "openclaw-agent",
              "actorDomain": "actors.resources.substrate.ate.dev",
              "actorToken": "${OPENCLAW_GATEWAY_TOKEN}",
              "replyPrefix": "🤖 ",
              "provisioner": "kubectl-ate",
              "kubectlAtePath": "/usr/local/bin/kubectl-ate",
              "ateapiAddress": "api.ate-system.svc.cluster.local:443"
            }
          }
        }
      },
      "acp": {
        "enabled": true,
        "backend": "substrate"
      },
      "agents": {
        "defaults": { "model": "google/gemini-3-flash-preview" }
      },
      "cron": { "enabled": false },
      "bindings": [
        {
          "type": "acp",
          "agentId": "main",
          "match": {
            "channel": "whatsapp",
            "accountId": "default",
            "peer": { "kind": "direct", "id": "REPLACE_WITH_WHATSAPP_PEER" }
          },
          "acp": { "backend": "substrate" }
        }
      ],
      "gateway": {
        "mode": "local",
        "port": 18789,
        "bind": "lan",
        "controlUi": {
          "enabled": true,
          "allowedOrigins": ["http://localhost:18789"]
        },
        "http": { "endpoints": { "chatCompletions": { "enabled": true } } },
        "auth": { "mode": "token" }
      },
      "channels": {
        "whatsapp": {
          "enabled": true,
          "dmPolicy": "open",
          "allowFrom": ["*"]
        }
      }
    }
